<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Establece el set de caracteres a UTF-8 -->
    <meta charset="UTF-8">
    <!-- Configuración inicial para la responsividad -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titulo de la pagina -->
    <title>Google Clone</title>
    <!-- Iconos de google -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Importar la hoja de estilos -->
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- Tu código HTML va aquí -->
     <main> 
          <!-- Logo de Google -->
          <div class="logo">
                <img
                     src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Google_2015_logo.svg"
                    alt="Google"
               >
          </div>

          <!-- Barra de búsqueda -->
           <div class="search-container">
               <!-- Icono de búsqueda -->
                <span class="material-icons search-icon">search</span>
               <!-- Campo de texto -->
                <input type="text" id="search-input" placeholder="Preguntale a Google">
               <!-- Icono del micrófono -->
                <span class="material-icons mic-icon">mic</span>
          </div>
          
          <!-- Botones de búsqueda -->
          <div class="buttons-container">

               <button id="search-button">Buscar con Google</button>

              <button id="lucky-button">Me siento con suerte</button>

          </div>
     </main>
    <!-- Importar el script -->
    <script src="script.js"></script>
</body>
</html>
